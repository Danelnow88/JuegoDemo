<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boceto: fantasma aislado - Espectro Lite</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #dffcff;
      background: #000;
    }
    .demo {
      width: min(94vw, 900px);
    }
    .demo-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      color: #ff8a24;
      font-size: 18px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .status {
      margin: 0;
      color: #91a7b8;
      font-size: 12px;
    }
    #battlefield {
      position: relative;
      width: 100%;
      aspect-ratio: 900 / 520;
      overflow: hidden;
      background: #000;
    }
    #specterCanvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .legend {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #708496;
      font-size: 11px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <!-- El módulo solo define su API; no crea recursos ni se inicia por sí mismo. -->
  <script>
    window.NV = window.NV || {};
  </script>
  <!-- Ruta relativa igual que en el preview original: colocá este archivo en la misma
       carpeta (previews/) para que ../js/render/espectroLite.js siga apuntando bien.
       Si lo movés a otro lado, ajustá esta ruta. -->
  <script src="../js/render/espectroLite.js"></script>
</head>
<body>
  <main class="demo">
    <header class="demo-head">
      <h1>Boceto: fantasma aislado</h1>
      <p id="status" class="status">Inicializando Three.js...</p>
    </header>
    <section id="battlefield" aria-label="Fantasma aislado sobre fondo negro">
      <canvas id="specterCanvas"></canvas>
    </section>
    <div class="legend">
      <span>1 instancia, centrada</span>
      <span id="variantLabel">forma/color configurables arriba en el script</span>
    </div>
  </main>

  <script type="module">
    import * as THREE from 'three';

    const NV = window.NV;
    const host = document.getElementById('battlefield');
    const canvas = document.getElementById('specterCanvas');
    const status = document.getElementById('status');
    const variantLabel = document.getElementById('variantLabel');

    // ---- Parámetros editables del fantasma aislado ----
    // Cambiá estos valores y recargá con Live Server para probar variantes.
    const GHOST_FORM = 0.35;          // 0..1, selecciona la variante de forma procedural
    const GHOST_SCALE = 0.4;          // mismo rango que usaba el preview original (0.2 / 0.4)
    const GHOST_VARIANT_COLOR = [1, 0, 0]; // rojo puro; probá los otros del set original:
    // [1, 0.5, 0]   naranja/fuego
    // [1, 0, 0.5]   rojo profundo casi púrpura
    // [1, 0.3, 0.1] brasa
    // [0.72, 0, 0.18] sangre oscura
    // [1, 0.75, 0.08] amarillo incandescente
    // -----------------------------------------------------

    // Cámara de prueba: mismo encuadre que el preview original.
    const camera = new THREE.OrthographicCamera(-450, 450, 260, -260, 0.1, 100);
    camera.position.z = 10;

    // Activación e inicialización EXPLÍCITAS: el módulo permanece inerte sin esto.
    NV.ESPECTRO_LITE_ACTIVE = true;
    const lite = NV.initEspectroLite(THREE, {
      host,
      canvas,
      camera,
      width: 900,
      height: 520,
    });

    if (!lite) {
      status.textContent = 'No se pudo inicializar Espectro Lite';
      throw new Error('NV.initEspectroLite devolvió null');
    }

    // Un solo fantasma, centrado en el recuadro.
    lite.createEnemy({
      x: 0,
      y: 0,
      z: 0,
      scale: GHOST_SCALE,
      phase: 0,
      form: GHOST_FORM,
      variantColor: GHOST_VARIANT_COLOR,
    });

    status.textContent = '1 fantasma activo';
    variantLabel.textContent = 'form=' + GHOST_FORM + ' · scale=' + GHOST_SCALE + ' · color=[' + GHOST_VARIANT_COLOR.join(', ') + ']';

    // Bucle exclusivo de esta prueba manual. No toca el bucle de game.js.
    const startedAt = performance.now();
    function animate(now) {
      const time = (now - startedAt) / 1000;
      const beat = Math.pow(Math.max(0, Math.sin(time * Math.PI * 2)), 6);
      NV.updateEspectroLite(time, beat);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    window.addEventListener('beforeunload', () => lite.dispose(), { once: true });
  </script>
</body>
</html>
